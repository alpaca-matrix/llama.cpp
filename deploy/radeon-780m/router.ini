;
;   ornith-q6-eval      skinnyctax uniform Q6_K of `fast`'s own weights (27.20 GiB)
;   ornith-mrader-eval  mradermacher Q6_K of the same weights, BF16 -> FP8 -> Q6_K
;                       (27.20 GiB) + its own mmproj (0.84 GiB)
;
;       Both fetched 2026-08-16 and deleted the same day WITHOUT being evaluated:
;       no spec-sweep, no eval tier, no perplexity pair. The question they were
;       fetched to answer is therefore still OPEN, not settled - whether a
;       uniform Q6_K of Ornith repairs `fast`'s marginal termination (8/10 with
;       two truncations, 93.6k chars) the way EVAL-PLAYBOOK.md step 8 says a
;       higher tier repairs marginal failures. Nothing here refutes that; nobody
;       tested it.
;
;       ONE FACT WAS ESTABLISHED before deletion, and it is the expensive one to
;       re-derive: ornith-q6-eval LOADED AND SERVED using `fast`'s own SC117
;       mmproj, at 262144 ctx, with real traffic through the router. That was
;       open question 1 in its stanza - skinnyctax publishes no mmproj and the
;       pairing was explicitly "a load test, not a fact". It pairs. A refetch of
;       the skinnyctax trunk does not need to re-establish that, and does not
;       need the mradermacher mmproj as the fallback it was partly kept for.
;
;       Note for any refetch: `fast`'s mmproj is SHARED, not per-stanza.
;       ornith-q6-eval pointed at the same SC117-...-mmproj-F16.gguf that [fast]
;       uses, so that file was deliberately NOT deleted with the rest.
