;       The post-train, not the weights, is what makes an agentic coder.
;
;   nerkyor/Qwen3.6-35B-A3B-APEX-MTP-GGUF (I-Balanced)   rejected 2026-08-04 and
;       again on re-test: 5/10 with 5 truncations and 143,308 chars of reasoning
;       against 6/10, 4 truncations and 143,125 chars then. Fastest model ever
;       measured here (35.14 tg) AND the best perplexity ever measured here
;       (2.0069, beating `fast` at 61 of 61 paired chunks) - and it still cannot
;       finish a hard reasoning item. Do not test it a third time.
;
;   zTrojan/Qwen3.5-122B-A10B-REAP30-APEX-GGUF (Mini)   30% expert-pruned. Loses
;       to `deep` on every axis at once. Rejected AT THIS TIER - I-Compact was
;       never tested, so the tier question is open, but a larger file only makes
;       the speed deficit worse.

