; Removed 2026-08-17 by user decision, weights deleted (101.80 GiB reclaimed
; across the day). Rejected on measurement first, at BOTH tiers, so this is a
; verdict rather than a slot being given up:
;
;   qcn-eval   Qwen/Qwen3-Coder-Next 80B-A3B, arch qwen3next, 512 experts
;       top-10, 12 of 48 layers full attention, tokenizer qwen2/151936,
;       apache-2.0. Two tiers from bartowski/Qwen_Qwen3-Coder-Next-GGUF:
;       IQ4_XS-imatrix (39.91 GiB, 45.6 GiB resident) and Q6_K (61.27 GiB in
;       two split parts, 66.9 GiB resident). Plus two external drafters,
;       z-lab DFlash 0.5B q8_0 (486 MiB) and thoughtworks Eagle3 145M Q8_0
;       (153 MiB). The same base held `coder` 2026-07-31 to 2026-08-03 at
;       unsloth's UD-Q4_K_XL and was retired then too.
;
; Full numbers in EVAL-PLAYBOOK.md "Results, 2026-08-17" and candidates.md
; ("Qwen3-Coder-Next at IQ4_XS: swept, evaluated, rejected" and "The step-8 tier
; test on Qwen3-Coder-Next: Q6_K"). The four things worth knowing before anyone
; re-downloads any of it:
;
;   1. IT LOSES ON TURNS, NOT ON SCORE. At Q6_K it reaches 6/6 on both coding
;      tiers - what `balanced` already has - needing 2.6x the turns (87 against
;      33 on code-eval-claude), 2.4x the wall clock, 42% less generation
;      (17.94 tg against 30.87), 44% less prefill, and 2.5x the pool.
;
;   2. THE TIER WAS REAL. IQ4_XS scored 5/6 on BOTH coding tiers by stalling
;      out; Q6_K repaired both (dup-block 32 turns -> 4, dup-line turn-limit ->
;      13) and cost 20% of generation and 33% of prefill to do it. It also
;      BROKE clean tool discipline, 0 -> 2 read-before-edit and 0 -> 3 edit
;      misses. Paired perplexity 61/61 with zero flips, 0.623%.
;
;   3. EXTERNAL DRAFTERS WEDGE SLOTS ON THIS MODEL. Seven of 21 speculated
;      sweep cells hung - both drafters, n-max 2/3/4, one and two streams,
;      p-min 0/0.3/0.5. Generation freezes mid-request at n_decoded 150-230,
;      /slots keeps reporting is_processing with the counter frozen, the GPU
;      sits at 90% emitting nothing until the client times out, and it clears
;      when the client gives up. `journalctl -k` stayed clean, so it is NOT the
;      compute-ring watchdog, and it reproduced on ordinary router traffic with
;      EOS enabled, so it is NOT the sweep harness's ignore_eos. Never seen in
;      nine unspeculated cells. `fast` and `balanced` speculate via MTP and have
;      never shown it; the untested hypothesis is the external drafter itself.
;      DO NOT re-download a drafter for this model without re-reading that.
;      DFlash was the better of the two by a wide margin - acceptance 0.805
;      against Eagle3's 0.574 at the same n-max 3 - and still lost to shipping
;      nothing: +5.7% aggregate at one stream against -10% at two.
;
;   4. ONE RESULT THAT OUTLIVES THE MODEL, and it is about this box rather than
;      about Qwen. Same weights, same MUL_MAT_ID path, two quant types: Q6_K
;      predicted 18.3 t/s by the bytes-per-token model and measured 17.94, a 2%
;      miss, where IQ4_XS predicted 28.1 and measured 22.29, a 21% miss. The
;      byte model is fine; IQ4_XS on ROUTED EXPERTS is the anomaly. Narrow the
;      "IQ4_XS is smaller AND faster" heuristic, not the byte model. A Q4_K_M
;      tier of this model would separate "IQ4-family on experts" from "anything
;      under ~5 bpw on experts" - that experiment is still open and does not
;      need this model to hold an alias.
;
; Also worth keeping: a NON-THINKING model scored 9/10 on reason-eval-hard with
; zero chars of reasoning, most items in 1.0-1.4 s, the whole tier in 41 s
; against `balanced`'s 206 s, and never truncated. Nothing else measured here
; has come close to that tier without a thinking channel. It lost the tier
; anyway, 9/10 against 10/10, failing the same item at both tiers on the same
; anti-pattern - so that miss was the model, not the quantization.

