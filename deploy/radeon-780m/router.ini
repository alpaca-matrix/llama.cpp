version = 1

; Alias -> upstream identity. Local filenames are shortened, so this table is
; what to correlate against Hugging Face. "GGUF repo" is what was downloaded;
; "base" is the upstream model it quantises.
;
;   fast    GGUF nerkyor/Qwen3.6-35B-A3B-DSV4Pro-Thinking-Distill
;           base Qwen/Qwen3.6-35B-A3B (community reasoning-distill fine-tune)
;           gguf general.name "Distill 35b Bf16 Vllmfix", arch qwen35moe.
;           Took the alias from Ornith-1.0-35B-MTP-APEX 2026-08-04, reverted
;           to Ornith same day after a GPU-hang incident, redeployed 2026-08-04
;           with a fix (spec-draft-type-k/v=q8_0) - see candidates.md.
;   coder   GGUF nerkyor/Qwen3.6-35B-A3B-DSV4Pro-SFT-GPT56Sol-RL-Agent-GGUF
;           base Qwen/Qwen3.6-35B-A3B (community SFT+RL fine-tune)
;           gguf general.name "Qwen3.6-35B-A3B-DSV4Pro-AgentRL-v3-BF16"
;   assist  GGUF unsloth/Qwen3-VL-30B-A3B-Instruct-GGUF (UD-Q4_K_XL)
;           base Qwen/Qwen3-VL-30B-A3B-Instruct, arch qwen3vlmoe, apache-2.0
;   deep    GGUF gpt-oss-120b MXFP4; publisher not recorded in the file's
;           metadata and not verified - base openai/gpt-oss-120b, arch gpt-oss
;
; Retired: unsloth/Qwen3-Coder-Next-GGUF (UD-Q4_K_XL), base Qwen/Qwen3-Coder-Next,
; arch qwen3next - held the `coder` alias until 2026-08-03. Weights and drafter
; deleted from disk 2026-08-04 (see candidates.md "Measured on this box" for
; the full verdict history).
;
; Retired: SC117/Ornith-1.0-35B-MTP-APEX-GGUF, base deepreinforce-ai/Ornith-1.0-35B
; (post-trained on Qwen3.5) - held the `fast` alias until 2026-08-04, held it
; again briefly the same day as the emergency revert target after the Thinking-
; Distill incident below. Beaten on served throughput and hard-reasoning by
; Thinking-Distill (see candidates.md). Weights not deleted from disk - kept as
; the rollback target: /root/models/ornith35-mtp-q.gguf, ornith35-mmproj-F16.gguf.
;
; 2026-08-04 GPU-hang incident, fixed and redeployed same day: Thinking-Distill
; hit two `amdgpu ring comp_1.1.0 timeout` -> `ErrorDeviceLost` GPU hangs within
; its first 3 hours live under real opencode traffic (never reproduced by any
; standalone eval). Root cause: the deployed config omitted `spec-draft-type-k/v`
; (defaults to F16), unlike Ornith's proven `q8_0`; the MTP draft context runs a
; full catch-up decode on every prefill ubatch (common/speculative.cpp
; process()), so its KV bandwidth scales with the whole accumulated conversation
; - F16 at n-max=4 roughly doubles that bandwidth over Ornith's q8_0-at-n-max=3.
; Reverted to Ornith immediately, then fixed by adding `spec-draft-type-k/v =
; q8_0` (kept n-max=4) and verified via a ~20 min standalone soak on a spare
; port crossing both incident depths (~2k and >67k accumulated tokens) with
; concurrent two-slot traffic - zero hangs, but that soak is shorter than the
; ~30 min mark where the first real incident hit, so treat this as a fix with
; good but incomplete confidence, not a proven-safe config. Watch
; `journalctl -u llama-server` and host `dmesg` for the same signature after
; redeploy. Full incident + soak-test writeup in candidates.md.

; measured-optimal defaults: Radeon 780M / Zen4 / Mesa 26.1.6 / 60 GiB GTT
; retune ubatch-size after any Mesa or llama.cpp update
[*]
n-gpu-layers   = 99
flash-attn     = on
ubatch-size    = 2048
batch-size     = 2048
threads        = 8
cache-type-k   = q8_0
cache-type-v   = q8_0
jinja          = true
cache-reuse    = 256

; agent clients (Claude Code, OpenCode) interleave one large growing prompt
; with small background requests; a second slot keeps those from evicting the
; main prefix, unified KV keeps the full ctx available to either slot, and the
; RAM prompt-cache restores any prefix that still gets displaced
parallel       = 2
kv-unified     = true
cache-ram      = 16384

; FAST: nerkyor/Qwen3.6-35B-A3B-DSV4Pro-Thinking-Distill, Q4_K_M (20.22 GiB) +
; mmproj-F16 (0.84 GiB). Community reasoning-distill fine-tune of
; Qwen/Qwen3.6-35B-A3B, same qwen35moe family and MTP shape as Ornith.
;
; Why this model: beats Ornith on base throughput (pp 375/347/323 vs
; 333/263/286, tg 28.7/25.9/23.2 vs 25.3/23.1/21.2) and served tg (~39-41 vs
; 34.6 tuned). Wins decisively on reason-eval-hard.sh - 10/10 zero-truncation
; in 154s/15.7k reasoning chars, against Ornith's 8-9/10 with truncations
; burning 72-95k chars. Vision + tool calling both confirmed. No depth
; collapse: 68% of tg64 retained at d65536 (Ornith 70.5%, coder 73.6%).
;
; draft length 4 is this model's own peak: 40.75/38.93 t/s served across two
; runs against n-max=3's 32.75, acceptance 0.83-0.90. p-min gives no reliable
; win here (0.3 destabilises: 23-43 t/s range) - left at default, unlike
; Ornith. q8_0 draft-KV added 2026-08-04 as a fix, NOT carried over from the
; first deploy: the first attempt at this alias omitted it (defaulted to F16)
; and hit two production `ErrorDeviceLost` GPU hangs in its first 3 hours live
; - see the incident note above and candidates.md. This is load-bearing, not
; cosmetic - do not drop it without re-running the soak test.
[fast]
model            = /root/models/nerkyor-thinking-distill-q4.gguf
mmproj           = /root/models/nerkyor-thinking-distill-mmproj-F16.gguf
cache-ram        = 24576
spec-type        = draft-mtp
spec-draft-n-max = 4
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = true

; CODER: nerkyor/Qwen3.6-35B-A3B-DSV4Pro-SFT-GPT56Sol-RL-Agent-GGUF, Q4 tier
; (19.06 GiB). Community SFT+RL fine-tune of Qwen/Qwen3.6-35B-A3B, 256 experts
; top-8, 40 blocks, GDN hybrid. Took the alias from Qwen3-Coder-Next 2026-08-03.
;
; Why the swap: measured on this box it beats Coder-Next on every axis - pp 326
; vs 229, tg 26.4 vs 18.6 base, served 26.14 vs 25 (and Coder-Next's 25 needed
; DFlash; this has no speculation at all). code-eval 4/4 in 104 s against 2/4 in
; 162 s with a stall. Coder-Next had also stopped loading entirely - repeatable
; DeviceLost during load - so the alias was unusable as it stood.
;
; No speculation available: no MTP head, no DFlash drafter, and the model card
; says explicitly not to pass --model-draft. That costs ~32% generation against
; fast, which is why this is `coder` and not the default.
;
; The GGUF's general.architecture reads qwen3next, but the weights are the
; qwen35moe-family Qwen3.6-35B-A3B and both behaviour and throughput track
; qwen35moe, not Coder-Next's slower qwen3next path. Mislabelled tag on a
; correctly-working model - see candidates.md for how that was established.
;
; ctx-size is 131072 for consistency with the other aliases, but this model has
; only been exercised to 32768 here. Re-measure before trusting a long prefix.
[coder]
model            = /root/models/nerkyor-dsv4pro-q4.gguf
cache-ram        = 24576
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = false

; ASSIST: Hermes Agent and general-purpose use; vision plus a 394 t/s prefill
; lead, which is the only reason it is still here (fast also has vision)
; 32 t/s and 256K ctx; no thinking channel, so send reasoning work to fast/deep.
; Chosen over gemma-4-26B-A4B, which also passed vision and tools but generates
; at 17.8 t/s - its one advantage, a real reasoning channel, is already covered
; by fast (thinking, and faster) and deep (reasoning_effort, and stronger).
[assist]
model            = /root/models/Qwen3-VL-30B-A3B-Instruct-UD-Q4_K_XL.gguf
mmproj           = /root/models/Qwen3-VL-30B-A3B-mmproj-F16.gguf
ctx-size         = 131072
load-on-startup  = false

; DEEP: architecture design, deep analysis
; effort per request: chat_template_kwargs {"reasoning_effort": "low"|"medium"|"high"}
[deep]
model            = /root/models/gpt-oss-120b-MXFP4.gguf
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = false
