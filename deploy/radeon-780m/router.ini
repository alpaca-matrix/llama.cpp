; QCN-EVAL: Qwen3-Coder-Next 80B-A3B at bartowski's Q6_K, 61.27 GiB in two
; split parts. Point at part 1; llama.cpp resolves part 2 from the naming.
; Eval slot, never load-on-startup, not in opencode.json.
;
; THIS IS THE STEP-8 TIER TEST, run 2026-08-17 by user request. The IQ4_XS tier
; of this same model was swept and rejected the same day (its whole record is
; kept below, because it is what this tier is scored against), and the open
; question the rejection did NOT close was whether the tier was doing the
; damage. Everything below the "IQ4_XS RECORD" marker describes that file, not
; this one.
;
; cache-ram is 4096 here, NOT the 24576 every other stanza carries, and that is
; deliberate. At ~67 GiB resident this model plus a 24 GiB RAM prompt cache
; would ceiling at ~91 GiB against the 78 GB this LXC can see. A prompt cache
; that cannot be backed is an OOM waiting for a long session. Weigh any
; prompt-cache-sensitive result against `balanced`'s 24576 accordingly.
;
; -------------------------------- IQ4_XS RECORD --------------------------
;
; Same base that held `coder` from 2026-07-31 to 2026-08-03 at unsloth's
; UD-Q4_K_XL. What is new is the tier. IQ4_XS costs 2054 MiB per token against
; that file's back-solved 2205, so the bytes-per-token model predicts 28.1 t/s
; where it measured 26.14 unspeculated - and IQ4_XS is the type this box keeps
; measuring as both smaller and faster than Q5_K on the Vulkan backend. Full
; paper vetting is in candidates.md under "Phase 0 - Nemotron 3.5 Lightning
; 30B-A3B and Qwen3-Coder-Next".
;
; arch qwen3next: 48 blocks, 36 gated-delta-net + 12 full attention
; (full_attention_interval 4), 512 experts top-10, one shared expert. KV is
; cheap - 12 attention layers at n_embd_k_gqa 512 is ~3.2 GiB of q8_0 KV at the
; native 262144. The previous `coder` never ran past 131072; the ctx bump landed
; 2026-08-04, the day after this model lost the alias, so 262144 here is new
; ground - and it loads fine, 16.3 GiB VRAM + 29.6 GiB GTT = 45.6 GiB resident,
; against `deep`'s 44.22, inside a 76 GiB pool. Load takes 29 s cold.
;
; FIRST MEASUREMENT, 2026-08-16, probe-server.sh 3 samples through the router:
; pp median 231.1 t/s (229.6-231.2), tg median 22.06 t/s (21.99-22.07).
;
; That is 21% UNDER the 28.1 t/s the bytes-per-token model predicted from 2054
; MiB per token, and the spread across three samples is 0.4%, so it is the
; prediction that is wrong, not the measurement. The likely reason is the one
; that memory already carries: bytes saved only become speed if the dequant
; kernel keeps up, and IQ4_XS here sits on the ROUTED EXPERTS, which go through
; Vulkan's MUL_MAT_ID path - not on attention tensors read in full, which is
; where IQ4_XS hit its prediction exactly on Laguna. Treat the byte model as
; calibrated for full-read tensors and unproven for expert tensors until a
; Q4_K_M tier of this same model is measured beside it.
;
; Do NOT compare 22.06 against the retired unsloth UD-Q4_K_XL's 26.14. That
; number was taken at `parallel = 2` on an older build, and this repo has been
; burned by exactly that before - `fast`'s code-eval-hard went 163 s to 255 s
; across the parallel 2 -> 3 change with no model change at all.
;
; Tokenizer is qwen2 / 151936, which does NOT match `fast` and `balanced`
; (qwen35 / 248320). There is no cross-model perplexity pairing available for
; this candidate - step 7 can only compare its own tiers against each other.
;
; NO SPECULATION, and this is now MEASURED, not provisional. There is no MTP
; head (no nextn tensors in the file, and `qwen3next` has no nextn path in this
; tree), and the full step-3 sweep of both external drafters on 2026-08-17 found
; nothing worth shipping. DFlash beats Eagle3 by a wide margin - acceptance
; 0.805 against 0.574 at the same n-max 3, and Eagle3 lost to no speculation at
; every setting measured - but DFlash itself loses at the concurrency this box
; serves:
;
;     conc   config              aggregate t/s     vs no speculation
;     1      none                 12.54 / 12.95    -            (two runs)
;     1      dflash n3            13.17 / 13.18    +3.4%        (two runs)
;     1      dflash n3 p0.75      13.48            +5.7%   <- best speculated
;     2      none                 14.18 / 14.04    -            (two runs)
;     2      dflash n2            12.74            -10.2%
;     2      dflash n2 p0.5       12.73            -10.2%  <- p-min cannot fix it
;     2      dflash n3            12.14            -14.4%
;
; Noise floor re-measured at 1-3% on the three cells the verdict rests on. So
; the trade is +5.7% at one stream for -10% at two, the mirror image of `fast`'s
; and pointing the other way. Full tables in candidates.md, "Qwen3-Coder-Next at
; IQ4_XS: swept, evaluated, rejected".
;
; REJECTED 2026-08-17 on the eval tiers, same session, against `balanced`:
; 9/10 reason-eval-hard (0 truncations, 41 s, ZERO chars of reasoning - it has
; no thinking channel, which is genuinely interesting) but 5/6 on BOTH coding
; tiers, on a bench six previous models all scored 6/6, and 108 turns on
; code-eval-claude against `balanced`'s 33. Slower on every throughput axis too
; (22.29 tg against 30.75, 13.49 aggregate against 15.24).
;
; ------------------------------ END IQ4_XS RECORD ------------------------
;
; The IQ4_XS weights and both drafter files are deleted once this tier's
; evaluation completes, by user decision. Paired perplexity between the two
; tiers is taken BEFORE that deletion - same model, same qwen2/151936
; tokenizer, so it is the one clean within-model tier comparison available and
; it is unrecoverable afterwards.
[qcn-eval]
model            = /root/models/EVAL-QCN-Q6_K-00001-of-00002.gguf
cache-ram        = 4096
ctx-size         = 262144
load-on-startup  = false

; ############ DO NOT SHIP EITHER OF THESE. THEY WEDGE SLOTS. ############
;
; Swept in full 2026-08-17 and both rejected - see the [qcn-eval] block above
; for the throughput tables. The throughput case was already zero; the reason
; these carry a warning rather than just a verdict is separate and worse:
;
;   SPECULATION ON THIS MODEL HARD-WEDGES A SLOT. Seven of 21 speculated sweep
;   cells hung, on both drafters, at n-max 2/3/4, at one and two streams, and at
;   p-min 0/0.3/0.5. Signature: generation freezes mid-request at n_decoded
;   150-230, `/slots` keeps reporting is_processing with n_decoded frozen, the
;   GPU sits at 90% busy emitting nothing until the client times out. It always
;   recovers when the client gives up - no D-state, no power cycle needed.
;
;   It is NOT the amdgpu compute-ring watchdog: `journalctl -k` stayed clean for
;   the whole session, no `ring comp_X timeout`, no `device wedged`.
;
;   It is NOT an artifact of spec-sweep's `ignore_eos`. Five ordinary chat
;   requests through the production router, EOS enabled, reproduced it - one of
;   five wedged for 300 s against `qcn-dflash-eval` and the same prompt
;   completed in 27 s against unspeculated `qcn-eval`.
;
;   Never happened in nine unspeculated cells. `fast` and `balanced` speculate
;   via MTP and have never shown it; the untested hypothesis is that an EXTERNAL
;   drafter model is what these two have in common and those two do not.
;
; `spec-draft-n-max = 4` below is still the July PROBE value, deliberately left
; as-is because there is no tuned value to replace it with - the sweep's answer
; was "do not speculate", not "speculate at N".
;
; Original 2026-08-16 note follows, kept because its single-prompt numbers are
; the calibration for how badly a boilerplate prompt flatters a drafter.
;
; Drafter probes, 2026-08-16. Identical weights to `qcn-eval`; the only
; difference is the speculation block. They were added to answer one question -
; does the drafter load and actually draft - with a single request each.
; BOTH ANSWERED YES, so they are kept as the sweep targets rather than deleted.
;
; Measured 2026-08-16, one 160-token code completion each through the router,
; against `qcn-eval` unspeculated on the identical prompt (22.29 t/s):
;
;     drafter    tg t/s    acceptance    mean draft len
;     none        22.29        -              -
;     dflash      36.56      0.984 (126/128)  4.0
;     eagle3      23.06      0.724 (118/163)  3.x
;
; That prompt is short, deterministic boilerplate, which is why DFlash accepts
; 98% - do NOT read those as workload numbers. What they establish is that both
; drafters engage, and that at the same n-max the acceptance gap decides
; everything: 0.72 barely pays for a 5-token verify batch on a 512-expert
; top-10 MoE, which is the same cost structure that killed DFlash on Laguna.
;
; How badly that flattered them, measured on real source a day later: DFlash's
; 36.56 t/s at 0.984 acceptance is 24.37 at 0.805, and Eagle3's 23.06 is 16.29
; at 0.574 - i.e. Eagle3 went from "buys ~3%" to "costs 20%". A single
; boilerplate prompt is worth exactly what the playbook says it is worth.
;
; DFLASH: z-lab's Qwen3-Coder-Next-DFlash 0.5B at q8_0, via transmutator's GGUF.
; arch `dflash`, embedding_length 2048 matching the target, target_layers
; [4,12,24,36,44], block_size 16, own context_length 262144. This is the same
; drafter `coder` ran, where it measured 88% acceptance. Loads and reports
; block_size=16, mask_token_id=151669, n_extract=5.
; SWEPT AND REJECTED 2026-08-17: the better of the two drafters by a wide margin
; and still a net loss - +5.7% aggregate at one stream, -10% at two, and it is
; one of the two configurations that wedge slots.
[qcn-dflash-eval]
model            = /root/models/EVAL-Qwen3-Coder-Next-IQ4_XS.gguf
cache-ram        = 24576
spec-type        = draft-dflash
spec-draft-model = /root/models/EVAL-QCN-DFlash-q8_0.gguf
spec-draft-n-max = 4
ctx-size         = 262144
load-on-startup  = false

; EAGLE3: thoughtworks' Qwen3-Coder-Next-Eagle3 145M head at Q8_0, via jdluzen's
; GGUF. arch `eagle3`, target_hidden_size 2048 and vocab_size 151936 both
; matching the target, target_layers [2,24,45]. Loads and drafts, at acceptance
; 0.72 for +3% of generation - the weaker of the two by a wide margin, and the
; likely reason is that it is a 145M head against DFlash's 0.5B. Two things to
; check before spending a sweep on it: its own context_length is 4096, and it
; loads with `special_eos_id is not in special_eog_ids - the tokenizer config
; may be incorrect`, which nothing else here emits.
; SWEPT AND REJECTED 2026-08-17, and it was not close: it lost to no speculation
; at EVERY setting measured, at both concurrencies - -10.1% at n-max 1 and
; -20.2% at n-max 3 on one stream, -20.9% and -36.2% on two. Acceptance on real
; source is 0.574 at n-max 3 and 0.483 at n-max 4, against DFlash's 0.805 and
; 0.987. It wedges slots as well. The 145M-against-0.5B size argument above is
; the best available explanation and it held up. Do not sweep it again.
[qcn-eagle3-eval]
model            = /root/models/EVAL-Qwen3-Coder-Next-IQ4_XS.gguf
cache-ram        = 24576
spec-type        = draft-eagle3
spec-draft-model = /root/models/EVAL-QCN-Eagle3-Q8_0.gguf
spec-draft-n-max = 4
ctx-size         = 262144
load-on-startup  = false

