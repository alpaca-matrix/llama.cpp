version = 1

; Two aliases are exposed, and only two. Since 2026-11-06 nothing else is
; reachable through this router: no eval slots, no `deep`. Everything that was
; here before (deep, q38d-eval, flint-eval, the old fast and balanced, and the
; long per-candidate verdict comments) is in git history:
;
;     git show 6b2751f12:deploy/radeon-780m/router.ini
;
; and the measurements behind them are in candidates.md and EVAL-PLAYBOOK.md.
; To evaluate something new, add a stanza here for the duration of the eval and
; take it out again; do not leave candidates exposed.
;
; Alias -> upstream identity (this table is what to correlate against
; Hugging Face; local filenames are shortened):
;
;   fast      GGUF unsloth/flint-GGUF requantised to the APEX Mini+ recipe
;             (file EVAL-flint-APEX-MiniPlus.gguf, 14.8 GiB, sha256
;             65be134c8c2a33a1d1ab3301d44d0b855724f862accdee61f3d211e992aba987)
;             base RecursiveSI/flint, arch `flint`, 39.8B total / 2.5B active
;             MoE, 256 experts top-6, 35 of 49 layers SWA-513, attention sinks,
;             NoPE on 14 layers. NO MTP head and NO mmproj: text only, and it
;             is plain autoregressive decode.
;   balanced  GGUF ornith-ai/Ornith-1.5-35B-A3B-GGUF (first-party), file
;             Ornith-1.5-35B-Q6_K.gguf plus that repo's mmproj; uniform Q6_K
;             including the native MTP head, 27.19 GiB
;             base ornith-ai/Ornith-1.5-35B-A3B, arch qwen35moe, mit
;             THE DEFAULT (the only load-on-startup alias).
;             Was served as `ornith15-q6-eval` until 2026-11-06.
;
; Why these two. `fast` is the speed slot: Flint at APEX Mini+ measured tg128
; 41.91 against 27.33 for its own Q6_K_XL in the same session (+53%) and held
; the reasoning and coding tiers (9/10 hard reasoning with one truncation,
; 6/6 on code-eval-hard and code-eval-claude). Caveats that were NOT closed
; before it took the alias: no soak under real agentic traffic, the benchmarks
; ran with the other PVE guests up, and N=10 on the reasoning tier cannot rank
; 9/10 against 10/10. Its experts are ~3-bit and the Flint card warns the model
; is quantisation-sensitive. Full numbers: candidates.md "Flint quant search".
;
; `balanced` is the user's choice of default (2026-10-20, overriding the
; 2026-09-08 rejection in candidates.md, which still stands as a record).
;
; ONE MODEL IS RESIDENT (--models-max 1). Naming the other alias evicts the
; resident one, which takes 14-31 s and, if the resident model is still loading
; or the GPU is busy, has wedged the device (models-max-1 swap incident). A
; second consumer must name the SAME alias the first one is using. Clients are
; expected to use `balanced`; `fast` is for when a session is started on it
; deliberately and nothing else is talking to the box.
;
; Vision: only `balanced` has an mmproj. `fast` cannot take images.

; measured-optimal defaults: Radeon 780M / Zen4 / Mesa 26.1.6 / 60 GiB GTT
; retune ubatch-size after any Mesa or llama.cpp update
[*]
n-gpu-layers   = 99
flash-attn     = on
ubatch-size    = 2048
batch-size     = 2048
threads        = 8
cache-type-k   = q8_0
cache-type-v   = q8_0
jinja          = true
cache-reuse    = 256

; agent clients (Claude Code, Hermes Agent) interleave one large growing prompt
; with small background requests; a second slot keeps those from evicting the
; main prefix, unified KV keeps the full ctx available to any slot, and the
; RAM prompt-cache restores any prefix that still gets displaced
;
; parallel = 3 is for a second independent consumer (Hermes Agent alongside a
; claude-local session), not for capacity. Measured on production-shaped
; requests, aggregate throughput is flat across one, two and three streams
; while per-stream tg falls almost exactly 1/n: one stream already saturates the
; memory bandwidth. The third slot buys concurrency (a second client does not
; queue behind a whole agent turn), not throughput.
;
;   1. With kv-unified, n_ctx_seq = n_ctx, so slots SHARE one ctx-size pool
;      instead of dividing it. The sum of all live conversations must fit in
;      ctx-size: two agents at 130k each is the ceiling here, not two at 262144.
;      claude-local halves max_context_tokens for exactly this reason.
;   2. On the GDN-hybrid alias (`balanced`) each slot has its own recurrent
;      state; check the RS buffer line in the load log after a swap.
;   3. Every generating slot puts its sampled token plus its whole draft into
;      ONE shared batch, and Vulkan's MUL_MAT_ID takes the fast matvec path only
;      up to mul_mat_vec_id_max_cols columns (default 8). The budget is
;
;          n_active_slots x (1 + spec-draft-n-max) <= max_cols
;
;      At parallel = 3 and n-max 2 that is 9 for `balanced`; `fast` does not
;      speculate, so it needs 3. GGML_VK_MUL_MAT_VEC_ID_MAX_COLS is 12 in the
;      systemd unit and covers both. See README "MoE vector-path threshold".
parallel       = 3
kv-unified     = true
cache-ram      = 16384

; FAST: Flint at APEX Mini+. Added 2026-10-28 as the `flint-eval` eval slot (at
; Q6_K_XL), moved onto this alias at Mini+ on 2026-11-06.
;
; Needs the hand-ported upstream PR 30928 (merged to master 2026-10-28); the
; serving binary has it from build 377 (4dec6562), earlier binaries do not. The
; embedded chat template uses a "\x00" escape this tree's jinja lexer rejects,
; so the template is supplied from the repo with that one filter removed.
;
; NO SPECULATION: Flint ships no MTP head and the incoai/Flint-DFlash2 drafter
; would need a DFlash2 port (selector and conv tensors the fork lacks). Flint
; at this tier still generates faster than the MTP-speculated `balanced`.
[fast]
model              = /root/models/EVAL-flint-APEX-MiniPlus.gguf
chat-template-file = /root/llama.cpp/deploy/radeon-780m/flint-chat-template.jinja
cache-ram          = 24576
ctx-size           = 262144
reasoning-format   = deepseek
load-on-startup    = false

; BALANCED: Ornith-1.5-35B-A3B first-party uniform Q6_K, MTP head native.
; Measured 2026-09-08 (candidates.md "Ornith-1.5-35B-A3B: two tiers, fully
; evaluated"): spec n_max 1/2/3/4 -> 29.67 / 31.72 / 33.28 / 32.37 tg on one
; stream and 16.40 / 17.05 / 16.50 / 11.81 aggregate on two. n_max 2 is the
; two-stream peak, the same trade the other MTP aliases made. p_min 0 won, and
; the whole p_min column sits inside the 1-2% noise floor. Keep
; spec-draft-type-k/v = q8_0: 0% on speed, halves the MTP draft KV.
;
; Each tier is paired with its OWN repo's mmproj. It is BF16 despite the
; filename conventions elsewhere, 334 tensors, and answers vision 4/4.
[balanced]
model            = /root/models/ORNITH-1.5-35B-official-Q6_K.gguf
mmproj           = /root/models/ORNITH-1.5-35B-official-mmproj-BF16.gguf
cache-ram        = 24576
spec-type        = draft-mtp
spec-draft-n-max = 2
spec-draft-p-min = 0
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
ctx-size         = 262144
reasoning-format = deepseek
load-on-startup  = true
