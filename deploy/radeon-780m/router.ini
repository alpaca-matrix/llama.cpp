; 2026-08-05 ErrorDeviceLost root cause - SUPERSEDES the 2026-08-04 diagnosis.
; The hangs were amdgpu's compute-ring watchdog, not anything about the model:
; this kernel defaults `amdgpu.lockup_timeout` to 2000 ms for all four rings,
; which is far too short for the multi-hundred-ms flash-attention dispatches
; this workload submits at depth. Fixed on the host cmdline with
; `amdgpu.lockup_timeout=10000,60000,10000,10000` (compute to 60 s), applied
; 2026-08-05, plus a Vulkan-backend change that aborts on device loss instead
; of serving a dead device for 26 minutes. Full writeup in README.md under
; "ErrorDeviceLost at depth is the compute-ring watchdog".
;
; What this means for the two 2026-08-04 reverts: they were wrong. The
; then-current theory blamed Thinking-Distill's MTP draft KV defaulting to F16
; instead of q8_0, and it cost that model the `fast` alias twice and got its
; weights deleted. It is exonerated - the same ring timeout hit `coder` on
; 2026-08-03 (21:05 and 22:08), and `coder` has no MTP head, no drafter and no
; speculation of any kind. Every incident correlates with context depth
; (n_tokens 67160 / 106011 / 115537 / 127774), not with the model.
;
; Weights redownloaded 2026-08-07 so the candidate could be re-evaluated on its
; merits; that evaluation completed 2026-08-14 and the Q4_K_M tier was removed
; (see `balanced`). Keep `spec-draft-type-k/v = q8_0` regardless: it measures 0% on speed and halves the MTP draft KV, which
; is worth it for the memory even though it was never the fix for this.

; measured-optimal defaults: Radeon 780M / Zen4 / Mesa 26.1.6 / 60 GiB GTT
; retune ubatch-size after any Mesa or llama.cpp update
[*]
n-gpu-layers   = 99
flash-attn     = on
ubatch-size    = 2048
batch-size     = 2048
threads        = 8
cache-type-k   = q8_0
cache-type-v   = q8_0
jinja          = true
cache-reuse    = 256

; agent clients (Claude Code, OpenCode) interleave one large growing prompt
; with small background requests; a second slot keeps those from evicting the
; main prefix, unified KV keeps the full ctx available to any slot, and the
; RAM prompt-cache restores any prefix that still gets displaced
;
; Raised 2 -> 3 on 2026-08-11 for a second independent consumer (Hermes Agent
; alongside a claude-local session), not for claude-local itself - that client
; pins tool_concurrency and max_concurrent_subagents to 1 and disables
; background tasks, so on its own it never has more than one request in flight.
;
; The third slot is free in KV terms: with kv-unified, n_ctx_seq = n_ctx
; (src/llama-context.cpp), so slots share one ctx-size pool instead of dividing
; it, and the MTP draft context inherits the same setting. What it does cost:
;
;   1. The pool is SHARED, so the sum of all live conversations must fit in
;      ctx-size. Two agents at 130k each is the ceiling here, not two at 262144.
;   2. On the GDN-hybrid aliases (fast, balanced) each slot gets its own
;      recurrent state - check the RS buffer line in the load log after a swap.
;   3. Every generating slot puts its sampled token plus its whole draft into
;      ONE shared batch, and Vulkan's MUL_MAT_ID picks the fast matvec path only
;      up to mul_mat_vec_id_max_cols columns (default 8). So the real budget is
;
;          n_active_slots x (1 + spec-draft-n-max) <= max_cols
;
;      At parallel = 3 that is 9 for `fast` (n-max 2), 9 for `balanced`,
;      3 for `deep` and `coder-eval`, neither of which speculates - so the speculating
;      aliases fall off the matvec path once every slot is busy, unless the
;      column limit is raised to match. GGML_VK_MUL_MAT_VEC_ID_MAX_COLS is set
;      to 12 in the systemd unit for that reason; measured 2026-08-11 it is
;      worth ~2-3% at three streams and NOTHING at the two-stream case this box
;      is tuned for, where `fast` sits at 6 columns - already under the default
;      8. It is kept for the occasional third stream only, and 12 still covers
;      every alias here. See README "MoE vector-path threshold".
;
; What parallel = 3 does NOT do is add capacity. Measured on production-shaped
; requests, aggregate throughput is flat at 15.4 / 15.4 / 15.2 t/s across one,
; two and three streams while per-stream tg falls 30.1 / 15.0 / 9.6 - almost
; exactly 1/n. One stream already saturates the memory bandwidth, so a second
; client takes half of the first client's speed rather than finding headroom.
; The point of the third slot is that a second client runs CONCURRENTLY instead
; of queueing behind a whole agent turn, which is a latency-fairness win, not a
; throughput one. Single-stream production was unchanged by the raise: 347.2 pp
; / 35.13 tg before, 347.5 / 35.22 after, at a cost of ~1.6 GiB.
;
; ONE MODEL IS RESIDENT (--models-max 1). A second consumer must name the SAME
; alias the first one is using. Two aliases at once do not co-exist - they evict
; each other every turn, and evicting a model that is still loading is what
; produced the 13-minute retry storm on 2026-08-09. `fast` carries vision, so
; Both `fast` and `balanced` carry vision, so a second client has no reason to
; name a different alias than the one already resident.
parallel       = 3
kv-unified     = true
cache-ram      = 16384

; FAST: general all-rounder - Ornith-1.0-35B (Qwen3.5-MoE, 8 of 256 active)
; Reasoning, vision and tools in one model. SWE-bench Verified 75.6 / Pro 50.4 /
; Multilingual 69.3, Terminal-Bench 64.2 (published figures, not measured here).
; draft length was 3 until 2026-08-11, on a single-stream sweep of 2/3/4/6
; (acceptance 0.83 and 34.6 t/s, against 0.29 and 20.2 t/s at the default 6).
; Now 2, because this box serves two clients and 3 is only the single-stream
; peak. Re-measured with REAL prompts (spec-sweep PROMPT_FILE) at two streams:
;
;     n-max     1 stream tg      2 streams tg    acceptance (2 streams)
;     0 (none)        -              16.27          -
;     1               -              17.57          0.874
;     2            34.05             18.67          0.782      <- deployed
;     3            33.88             17.54          0.709
;
; Those are spare-port numbers (ctx 32768, no cache-ram) and they say n-max 2
; and 3 TIE at one stream. Production says otherwise - the same A/B run through
; the real router, probe-server for one stream and conc-probe for two:
;
;     n-max     1 stream tg     2 streams tg    2 streams aggregate
;     2            33.97           18.55-19.23        17.64-17.70
;     3            35.59           17.68              16.49
;
; So this IS a trade: -4.6% at one stream for +8.8% at two. It is deployed
; because this box is tuned for two clients; break-even is roughly 35% of wall
; clock spent at two streams, so revisit if the second client goes quiet.
; Note the spare-port harness did NOT reproduce the single-stream regression -
; always confirm a draft-length change through the production router before
; believing it. On synthetic prompts the same sweep was wronger still, calling
; n-max 1 a 21% winner. Retune only with PROMPT_FILE set, and verify on 8080.
;
; p-min 0.3 truncates low-confidence drafts: still the peak at two streams,
; re-swept 2026-08-11 at n-max 2 (0 -> 18.47, 0.3 -> 18.67, 0.5 -> 17.10,
; 0.75 -> 17.53 tg; 0.75 buys acceptance 0.949 that nobody needed). q8_0 draft
; KV measures 0% on speed and halves the MTP layer's KV footprint.
;
; Holds the alias by default rather than on merit: it was reclaimed twice on
; 2026-08-04 on a GPU-hang diagnosis since proven wrong (see the incident notes
; above). Re-adjudicated 2026-08-14: at Q4_K_M that candidate lost outright -
; worse perplexity than this alias at 61 of 61 paired chunks, and unreliable on
; multi-image vision - and its weights were deleted. At Q6_K (`balanced`) it
; wins hard reasoning 10/10 against 8/10 and ties on perplexity, for ~10% of
; served generation and 5.3 GiB. That trade is not taken; this stays `fast`.
;
; ctx-size raised 131072 -> 262144 2026-08-04: the GGUF's own
; qwen35moe.context_length is 262144 (`gguf_dump.py`, confirmed on the box),
; so 131072 was leaving native context on the table, not a safety margin.
; Verified loadable standalone on a spare port at 262144 with this exact spec
; config (n-max=3, p-min=0.3, q8_0 draft-KV) before applying here: ~30.5 GiB
; GTT+VRAM total, comfortably inside the 76 GiB pool with `models-max = 1`.
; Not yet exercised past 131072 in any eval script - retune/re-verify
; anything depth-sensitive (draft acceptance, p-min) if it's ever run there.
[fast]
model            = /root/models/SC117-Ornith-1.0-35B-MTP-APEX-Q6_K.gguf
mmproj           = /root/models/SC117-Ornith-1.0-35B-MTP-APEX-mmproj-F16.gguf
cache-ram        = 24576
spec-type        = draft-mtp
spec-draft-n-max = 2
spec-draft-p-min = 0.3
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
ctx-size         = 262144
reasoning-format = deepseek
load-on-startup  = false

; DEEP: poolside/Laguna-S-2.1, 118B total / 8B active. Took this alias from
; gpt-oss-120b on 2026-08-14 when the lineup was cut to three; gpt-oss's weights
; were deleted with it. Purpose-built for long-horizon autonomous coding
; ("hundreds of reasoning steps"), which is the brief this box cares about more
; than throughput. Native arch support is in this tree (`src/models/laguna.cpp`,
; LLM_ARCH_LAGUNA) - verified, not assumed.
;
; From the GGUF's own metadata: arch `laguna`, 48 blocks, 256 experts top-10,
; head_count_kv 8, context_length 262144 (YaRN factor 32 from an 8192 base),
; sliding_window 512. Only 12 of the 48 layers are full attention and the other
; 36 are windowed, so KV growth with depth is cheap - the opposite of the MLA
; models rejected for this slot.
;
; Tier is a hand-built attn-IQ4_XS v3 requant (44.22 GiB) rather than a stock
; UD tier: UD-Q4_K_XL at 68.36 GiB leaves under 5 GiB of headroom in the 76 GiB
; pool, and the byte-budget rewrite that produced v3 bought ~18% of generation
; by extending IQ4_XS across the per-token reads. It is a LOWER quality tier
; than anything else serving here - weigh results accordingly, and see
; candidates.md "Rebalancing the quant byte budget on Laguna".
;
; NO SPECULATION, deliberately. The official DFlash drafter loads (support was
; ported from poolside's branch) and measures +0.9% tg at best for 2.2 GiB of
; pool, because on a 256-expert top-10 MoE a 5-token verify round costs ~233 ms
; against ~73 ms for one unspeculated decode. Break-even needs acceptance >0.55
; and p-min only reaches it by declining to draft at all. The drafter file was
; deleted 2026-08-14; do not re-download it without re-reading that section.
; Vendor guidance does not transfer either - poolside recommends
; --spec-draft-n-max 15, the worst setting measured here (2.90 vs 14.18 t/s).
;
; Text-only: no mmproj is published for this model. Send image work to
; `balanced` or `fast`.
[deep]
model             = /root/models/EVAL-Laguna-S-2.1-attnIQ4XSv3.gguf
cache-ram         = 24576
ctx-size          = 262144
reasoning-format  = deepseek
load-on-startup   = false

; BALANCED: nerkyor Qwen3.6-35B-A3B-DSV4Pro-Thinking-Distill at Q6_K-imatrix,
; 27.2 GiB. THE DEFAULT - the only alias with load-on-startup, promoted
; 2026-08-14 when the lineup was cut to three. Served as `td-q6-eval` while it
; was being evaluated.
;
; Why it is the default rather than `fast`: it wins the tier this repo built to
; discriminate, 10/10 with zero truncations in 207 s against `fast`'s 8/10 with
; two truncations in 987 s and 4.6x the reasoning. It carries vision and answers
; the two-image compare item 3/3 in 188 byte-identical tokens, where `fast`
; TRUNCATES that item at a 4000-token budget. It needs 33 turns on the Claude
; Code tier against `fast`'s 41. `fast` is kept for when raw speed matters -
; 33.96 tg against 30.66, and 347.8 pp against 296.4.
;
; The Q4_K_M tier of this same model served here as `nerkyor-eval` until
; 2026-08-14 and was removed: it measured WORSE than `fast` on perplexity (61 of
; 61 paired chunks) and scored 0/3 on multi-image vision. Q6_K fixed both, which
; is the whole reason this tier exists. Do not drop back to Q4 to save 7 GiB.
;
; What it still owes: the soak. It has never accumulated real agentic traffic
; past ~20 minutes, and the obligation is on THIS tier - a Q4 soak proved
; nothing. Watch `journalctl -u llama-server` and `journalctl -k` on the host
; (192.168.254.222) for ring timeouts during its first real sessions.
[balanced]
model            = /root/models/EVAL-nerkyor-TD-Q6_K.gguf
mmproj           = /root/models/nerkyor-Qwen3.6-35B-A3B-DSV4Pro-Thinking-Distill-mmproj-F16.gguf
cache-ram        = 24576
spec-type        = draft-mtp
spec-draft-n-max = 2
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
ctx-size         = 262144
reasoning-format = deepseek
load-on-startup  = true

