version = 1

; measured-optimal defaults: Radeon 780M / Zen4 / Mesa 26.1.6 / 60 GiB GTT
; retune ubatch-size after any Mesa or llama.cpp update
[*]
n-gpu-layers   = 99
flash-attn     = on
ubatch-size    = 2048
batch-size     = 2048
threads        = 8
cache-type-k   = q8_0
cache-type-v   = q8_0
jinja          = true
cache-reuse    = 256

; agent clients (Claude Code, OpenCode) interleave one large growing prompt
; with small background requests; a second slot keeps those from evicting the
; main prefix, unified KV keeps the full ctx available to either slot, and the
; RAM prompt-cache restores any prefix that still gets displaced
parallel       = 2
kv-unified     = true
cache-ram      = 16384

; FAST: general all-rounder - Ornith-1.0-35B (Qwen3.5-MoE, 8 of 256 active)
; Reasoning, vision and tools in one model. SWE-bench Verified 75.6 / Pro 50.4 /
; Multilingual 69.3, Terminal-Bench 64.2 - above coder's 70.6/44.3/62.8.
; draft length 3 is the peak: acceptance 0.83 and 34.6 t/s, against 0.29 and
; 20.2 t/s at the default 6. Measured 2/3/4/6; retune if the MTP head changes.
[fast]
model            = /root/models/ornith35-mtp-q.gguf
mmproj           = /root/models/ornith35-mmproj-F16.gguf
cache-ram        = 24576
spec-type        = draft-mtp
spec-draft-n-max = 3
spec-draft-p-min = 0.2
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = true

; CODER: kept for parametric breadth, not as the default - fast wins SWE-bench
; Verified, Pro and Multilingual outright. Demoted off startup 2026-08-01.
; Also the only alias that has produced incidents: the probe-server stall needs
; DFlash plus a cold reprefill, and the DeviceLost-on-load mode needs a separate
; drafter file. fast's MTP head is in-model, so neither applies to it.
; DFlash block-diffusion drafter; n-max 4 measured optimal - MoE verify cost
; scales with draft length (each token hits different experts), 8 regresses
[coder]
model            = /root/models/Qwen3-Coder-Next-UD-Q4_K_XL.gguf
cache-ram        = 24576
spec-type        = draft-dflash
spec-draft-model = /root/models/Qwen3-Coder-Next-DFlash-q8_0.gguf
spec-draft-n-max = 4
ctx-size         = 131072
load-on-startup  = false

; ASSIST: Hermes Agent and general-purpose use; vision plus a 394 t/s prefill
; lead, which is the only reason it is still here (fast also has vision)
; 32 t/s and 256K ctx; no thinking channel, so send reasoning work to fast/deep.
; Chosen over gemma-4-26B-A4B, which also passed vision and tools but generates
; at 17.8 t/s - its one advantage, a real reasoning channel, is already covered
; by fast (thinking, and faster) and deep (reasoning_effort, and stronger).
[assist]
model            = /root/models/Qwen3-VL-30B-A3B-Instruct-UD-Q4_K_XL.gguf
mmproj           = /root/models/Qwen3-VL-30B-A3B-mmproj-F16.gguf
ctx-size         = 131072
load-on-startup  = false

; DEEP: architecture design, deep analysis
; effort per request: chat_template_kwargs {"reasoning_effort": "low"|"medium"|"high"}
[deep]
model            = /root/models/gpt-oss-120b-MXFP4.gguf
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = false
