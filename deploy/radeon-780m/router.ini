; MYTHOS-EVAL: squ11z1/Mythos-nano at Q6_K, 2.36 GiB. Added 2026-08-17 BY USER
; DECISION AFTER IT FAILED STEP 0 - the stanza is here so the paper call can be
; confirmed or refuted by measurement, not because the vetting passed it.
;
; Why step 0 rejected it, all from the GGUF header:
;
;   DENSE. arch qwen2, 36 blocks, no expert tensors anywhere in the table. That
;   is the failure mode with the longest record on this box - four prior
;   rejections - and the reason is arithmetic, not preference: at Q6_K it reads
;   2.532 GB per token, so 70 GB/s caps it at 27.6 t/s and the realised band is
;   12.4-20.7. A 3.1B DENSE model is therefore no faster here than `balanced`,
;   which is a 35B MoE, while giving up ten times the parameters.
;   NO MTP HEAD. blk 0..35 against block_count 36, so nothing beyond the last
;   layer. Confirm it positively per step 3 (point spec-sweep at it with
;   SPEC_TYPE=draft-mtp and a non-zero n-max; a refused load is the result).
;   NO MMPROJ published, so it cannot serve screenshots.
;   TOKENIZER gpt2/qwen2 151936, so no paired perplexity against the incumbents.
;   Base is WeiboAI/VibeThinker-3B, a math and competition-reasoning model. Its
;   template does carry tools (<tool_call> JSON, qwen2 style) but no thinking
;   channel, so reasoning-format is left off.
;
; ctx-size is 131072 because that is this GGUF's own qwen2.context_length - it is
; the only alias here that cannot reach 262144.
;
; MEASURED 2026-08-17, load smoke test only: loads and answers, 6.15 GiB resident
; under load (GTT 0.55 + VRAM 5.60) - the lightest thing ever served on this box.
;
; ONE REAL DEFECT FOUND, and it will distort any eval tier run against this
; alias: IT THINKS IN THE CONTENT FIELD. The model emits `<think>` and llama.cpp
; does not extract it, because its template never renders a thinking channel for
; the autoparser to infer delimiters from - so `reasoning_content` came back
; EMPTY and the raw `<think>...` text landed in `message.content` (351 tokens on
; a one-line prompt). `reasoning-format` is therefore left off deliberately;
; setting it will not help, since the format detection is what is missing. Any
; scorer that reads content will be reading reasoning.
[mythos-eval]
model            = /root/models/EVAL-mythos-nano-Q6_K.gguf
cache-ram        = 4096
ctx-size         = 131072
load-on-startup  = false

; GEMMA4-12B-EVAL: yuxinlu1's agentic fine-tune of google/gemma-4-12B-it at Q6_K,
; 9.10 GiB, plus that repo's MTP drafter. Added 2026-08-17 BY USER DECISION AFTER
; IT FAILED STEP 0, same standing as `mythos-eval` above.
;
; Why step 0 rejected it, and this is the widest margin any candidate has failed
; on here: DENSE. arch gemma4, 48 blocks, no expert tensors. At Q6_K it reads
; 9.770 GB per token, so the ceiling is 7.2 t/s and the realised band 3.2-5.4 -
; against `balanced`'s measured 30.87. Speculation cannot close a 3x gap, and the
; lower tiers do not either: Q3_K_M would still only reach about 11 t/s ceiling.
; Note what dominates - the dense FFN alone is 6.97 GB of those 9.77, which is
; why this is a model-shape rejection and not a quant-tier question.
;
; It shares the 26B's good structural properties (gemma4 5:1 windowed attention,
; 262144 native ctx, native peg-gemma4 tool calling, `<|channel>thought`
; reasoning) and publishes no mmproj.
;
; THE DRAFTER IS A GRAFT, which is the KAT situation: the file is
; MTP/gemma-4-12B-it-MTP-Q8_0, i.e. the head for the BASE gemma-4-12B-it, while
; the target here is a fine-tune of it. It pairs dimensionally - arch
; gemma4-assistant, nextn_predict_layers 4, embedding_length_out 3840 matching
; this target's embedding_length, same gemma4/262144 tokenizer - so it should
; load and share KV as the 26B's does. Expect acceptance BELOW a co-trained head
; (KAT's graft accepted 0.76 against `fast`'s 0.85-0.87) and sweep it.
;
; Two provenance flags, neither disqualifying, both worth knowing: the GGUF
; carries no general.license and no base_model metadata (general.name is just
; "Gemma4 v2 Merged Fp16"), and it sets tokenizer.ggml.suppress_tokens
; [258883, 258882], which nothing else here does.
;
; MEASURED 2026-08-17, load smoke test only: loads with its drafter, answers
; correctly, extracts reasoning into `reasoning_content` like the 26B does,
; 17.53 GiB resident under load (GTT 3.22 + VRAM 14.30).
;
; THE GRAFT PENALTY IS REAL AND IT LANDED WHERE PREDICTED: draft acceptance
; 0.632 (24/38), mean len 2.26, against the 26B's 0.872 with its co-trained head
; on the same prompt in the same session. That is the KAT pattern reproduced on
; a second architecture - a base model's MTP head grafted onto a fine-tune
; accepts materially worse - and it is the cleanest measurement of it this box
; has, because both halves were taken minutes apart under identical conditions.
;
; It also loses `cache-reuse`, but for a DIFFERENT reason from the 26B: it has no
; mmproj, and the log says `cache_reuse is not supported by this context`, so
; here it is the shared-KV draft context that disables it. Both gemma4 aliases
; therefore run without the global cache-reuse = 256, by two separate routes.
[gemma4-12b-eval]
model             = /root/models/EVAL-gemma4-12B-agentic-Q6_K.gguf
cache-ram         = 4096
spec-type         = draft-mtp
spec-draft-model  = /root/models/EVAL-gemma4-12B-agentic-MTP-Q8_0.gguf
spec-draft-n-max  = 2
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
ctx-size          = 262144
reasoning-format  = deepseek
load-on-startup   = false

; Removed 2026-08-17 by user decision, weights deleted (101.80 GiB reclaimed
; across the day). Rejected on measurement first, at BOTH tiers, so this is a
; verdict rather than a slot being given up:
;
;   qcn-eval   Qwen/Qwen3-Coder-Next 80B-A3B, arch qwen3next, 512 experts
;       top-10, 12 of 48 layers full attention, tokenizer qwen2/151936,
;       apache-2.0. Two tiers from bartowski/Qwen_Qwen3-Coder-Next-GGUF:
;       IQ4_XS-imatrix (39.91 GiB, 45.6 GiB resident) and Q6_K (61.27 GiB in
;       two split parts, 66.9 GiB resident). Plus two external drafters,
;       z-lab DFlash 0.5B q8_0 (486 MiB) and thoughtworks Eagle3 145M Q8_0
;       (153 MiB). The same base held `coder` 2026-07-31 to 2026-08-03 at
;       unsloth's UD-Q4_K_XL and was retired then too.
;
; Full numbers in EVAL-PLAYBOOK.md "Results, 2026-08-17" and candidates.md
; ("Qwen3-Coder-Next at IQ4_XS: swept, evaluated, rejected" and "The step-8 tier
; test on Qwen3-Coder-Next: Q6_K"). The four things worth knowing before anyone
; re-downloads any of it:
;
;   1. IT LOSES ON TURNS, NOT ON SCORE. At Q6_K it reaches 6/6 on both coding
;      tiers - what `balanced` already has - needing 2.6x the turns (87 against
;      33 on code-eval-claude), 2.4x the wall clock, 42% less generation
;      (17.94 tg against 30.87), 44% less prefill, and 2.5x the pool.
;
;   2. THE TIER WAS REAL. IQ4_XS scored 5/6 on BOTH coding tiers by stalling
;      out; Q6_K repaired both (dup-block 32 turns -> 4, dup-line turn-limit ->
;      13) and cost 20% of generation and 33% of prefill to do it. It also
;      BROKE clean tool discipline, 0 -> 2 read-before-edit and 0 -> 3 edit
;      misses. Paired perplexity 61/61 with zero flips, 0.623%.
;
;   3. EXTERNAL DRAFTERS WEDGE SLOTS ON THIS MODEL. Seven of 21 speculated
;      sweep cells hung - both drafters, n-max 2/3/4, one and two streams,
;      p-min 0/0.3/0.5. Generation freezes mid-request at n_decoded 150-230,
;      /slots keeps reporting is_processing with the counter frozen, the GPU
;      sits at 90% emitting nothing until the client times out, and it clears
;      when the client gives up. `journalctl -k` stayed clean, so it is NOT the
;      compute-ring watchdog, and it reproduced on ordinary router traffic with
;      EOS enabled, so it is NOT the sweep harness's ignore_eos. Never seen in
;      nine unspeculated cells. `fast` and `balanced` speculate via MTP and have
;      never shown it; the untested hypothesis is the external drafter itself.
;      DO NOT re-download a drafter for this model without re-reading that.
;      DFlash was the better of the two by a wide margin - acceptance 0.805
;      against Eagle3's 0.574 at the same n-max 3 - and still lost to shipping
;      nothing: +5.7% aggregate at one stream against -10% at two.
;
;   4. ONE RESULT THAT OUTLIVES THE MODEL, and it is about this box rather than
;      about Qwen. Same weights, same MUL_MAT_ID path, two quant types: Q6_K
;      predicted 18.3 t/s by the bytes-per-token model and measured 17.94, a 2%
;      miss, where IQ4_XS predicted 28.1 and measured 22.29, a 21% miss. The
;      byte model is fine; IQ4_XS on ROUTED EXPERTS is the anomaly. Narrow the
;      "IQ4_XS is smaller AND faster" heuristic, not the byte model. A Q4_K_M
;      tier of this model would separate "IQ4-family on experts" from "anything
;      under ~5 bpw on experts" - that experiment is still open and does not
;      need this model to hold an alias.
;
; Also worth keeping: a NON-THINKING model scored 9/10 on reason-eval-hard with
; zero chars of reasoning, most items in 1.0-1.4 s, the whole tier in 41 s
; against `balanced`'s 206 s, and never truncated. Nothing else measured here
; has come close to that tier without a thinking channel. It lost the tier
; anyway, 9/10 against 10/10, failing the same item at both tiers on the same
; anti-pattern - so that miss was the model, not the quantization.

