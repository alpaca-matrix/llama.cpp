;   deep    GGUF poolside/Laguna-S-2.1, hand-requantised here to attn-IQ4_XS v3
;           base poolside/Laguna-S-2.1, arch `laguna`, 118B total / 8B active
;           Took this alias from gpt-oss-120b on 2026-08-14
;   coder-eval
;           GGUF nerkyor/Qwen3.6-35B-A3B-DSV4Pro-SFT-GPT56Sol-RL-Agent-GGUF,
