version = 1

; measured-optimal defaults: Radeon 780M / Zen4 / Mesa 26.1.6 / 60 GiB GTT
; retune ubatch-size after any Mesa or llama.cpp update
[*]
n-gpu-layers   = 99
flash-attn     = on
ubatch-size    = 2048
batch-size     = 2048
threads        = 8
cache-type-k   = q8_0
cache-type-v   = q8_0
jinja          = true
cache-reuse    = 256

; agent clients (Claude Code, OpenCode) interleave one large growing prompt
; with small background requests; a second slot keeps those from evicting the
; main prefix, unified KV keeps the full ctx available to either slot, and the
; RAM prompt-cache restores any prefix that still gets displaced
parallel       = 2
kv-unified     = true
cache-ram      = 16384

; FAST: general all-rounder - Ornith-1.0-35B (Qwen3.5-MoE, 8 of 256 active)
; Reasoning, vision and tools in one model. SWE-bench Verified 75.6 / Pro 50.4 /
; Multilingual 69.3, Terminal-Bench 64.2 - above coder's 70.6/44.3/62.8.
; draft length 3 is the peak: acceptance 0.83 and 34.6 t/s, against 0.29 and
; 20.2 t/s at the default 6. Measured 2/3/4/6; retune if the MTP head changes.
[fast]
model            = /root/models/ornith35-mtp-q.gguf
mmproj           = /root/models/ornith35-mmproj-F16.gguf
cache-ram        = 24576
spec-type        = draft-mtp
spec-draft-n-max = 3
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = false

; CODER: strongest agentic coder that fits the pool (SWE-bench Verified 70.6)
; DFlash block-diffusion drafter; n-max 4 measured optimal - MoE verify cost
; scales with draft length (each token hits different experts), 8 regresses
[coder]
model            = /root/models/Qwen3-Coder-Next-UD-Q4_K_XL.gguf
cache-ram        = 24576
spec-type        = draft-dflash
spec-draft-model = /root/models/Qwen3-Coder-Next-DFlash-q8_0.gguf
spec-draft-n-max = 4
ctx-size         = 131072
load-on-startup  = true

; ASSIST: Hermes Agent and general-purpose use, the only alias with vision
; 32 t/s and 256K ctx; no thinking channel, so send reasoning work to fast/deep.
; Chosen over gemma-4-26B-A4B, which also passed vision and tools but generates
; at 17.8 t/s - its one advantage, a real reasoning channel, is already covered
; by fast (thinking, and faster) and deep (reasoning_effort, and stronger).
[assist]
model            = /root/models/Qwen3-VL-30B-A3B-Instruct-UD-Q4_K_XL.gguf
mmproj           = /root/models/Qwen3-VL-30B-A3B-mmproj-F16.gguf
ctx-size         = 131072
load-on-startup  = false

; --- under evaluation ---
; fable27: dense 27B (not MoE) with MTP head and vision. AMD/Vulkan build -
; output tensor is f16 not bf16, which matters because this GPU reports bf16:0
; and would otherwise offload that tensor to CPU.
[fable27]
model            = /root/models/fable27-amd-mtp-iq4xs.gguf
mmproj           = /root/models/fable27-mmproj-F16.gguf
spec-type        = draft-mtp
spec-draft-n-max = 6
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = false

; glm47: MoE, only 4 of 64 experts active. The base config declares
; num_nextn_predict_layers=1 but this GGUF omits the NextN tensors, so
; draft-mtp fails at load with "failed to create MTP context" - no speculation.
[glm47]
model            = /root/models/glm47flash-q4kxl.gguf
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = false

; bonsai27: Qwen3.6-27B dense in ternary Q2_0 - 6.7 GiB against 50 GiB F16.
; Dense normally loses badly here (fable27, same base, 8.3 t/s) because every
; parameter is read per token; ternary cuts the bytes per parameter ~7x, which
; is exactly the axis this hardware is bound on. Vulkan does implement Q2_0.
; Ships its own dspark drafter rather than an MTP head.
[bonsai27]
model            = /root/models/bonsai27-q2_0.gguf
mmproj           = /root/models/bonsai27-mmproj-Q8_0.gguf
spec-type        = draft-dspark
spec-draft-model = /root/models/bonsai27-dspark-q4_1.gguf
spec-draft-n-max = 4
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = false

; defiant9b: dense 9B with MTP and vision. No AMD build in that repo, so the
; output tensor may be bf16 - this GPU reports bf16:0 and would offload it.
[defiant9b]
model            = /root/models/defiant9b-mtp-q6k.gguf
mmproj           = /root/models/defiant9b-mmproj-F16.gguf
spec-type        = draft-mtp
spec-draft-n-max = 6
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = false

; DEEP: architecture design, deep analysis
; effort per request: chat_template_kwargs {"reasoning_effort": "low"|"medium"|"high"}
[deep]
model            = /root/models/gpt-oss-120b-MXFP4.gguf
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = false
