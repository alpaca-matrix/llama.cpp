version = 1

; Alias -> upstream identity. Local filenames are shortened, so this table is
; what to correlate against Hugging Face. "GGUF repo" is what was downloaded;
; "base" is the upstream model it quantises.
;
;   fast    GGUF SC117/Ornith-1.0-35B-MTP-APEX-GGUF
;           base deepreinforce-ai/Ornith-1.0-35B (post-trained on Qwen3.5)
;           gguf general.name "Ornith 1.0 35B MTP", arch qwen35moe, mit
;           Lost the alias to Thinking-Distill 2026-08-04, reclaimed it same
;           day after a GPU-hang incident, lost it again briefly to a
;           q8_0-fixed Thinking-Distill redeploy, reclaimed it a second time
;           2026-08-04 pending further production soak - see candidates.md.
;   coder   GGUF nerkyor/Qwen3.6-35B-A3B-DSV4Pro-SFT-GPT56Sol-RL-Agent-GGUF
;           base Qwen/Qwen3.6-35B-A3B (community SFT+RL fine-tune)
;           gguf general.name "Qwen3.6-35B-A3B-DSV4Pro-AgentRL-v3-BF16"
;   assist  GGUF unsloth/Qwen3-VL-30B-A3B-Instruct-GGUF (UD-Q4_K_XL)
;           base Qwen/Qwen3-VL-30B-A3B-Instruct, arch qwen3vlmoe, apache-2.0
;   deep    GGUF gpt-oss-120b MXFP4; publisher not recorded in the file's
;           metadata and not verified - base openai/gpt-oss-120b, arch gpt-oss
;   nerkyor-eval  GGUF nerkyor/Qwen3.6-35B-A3B-DSV4Pro-Thinking-Distill
;           base Qwen/Qwen3.6-35B-A3B (community reasoning-distill fine-tune)
;           gguf general.name "Distill 35b Bf16 Vllmfix", arch qwen35moe.
;           Temporary evaluation slot, not wired to any client and not
;           load-on-startup - carries the q8_0 draft-KV fix from the second
;           `fast` redeploy attempt. See the incident notes below and
;           candidates.md before considering it for `fast` again.
;
; Retired: unsloth/Qwen3-Coder-Next-GGUF (UD-Q4_K_XL), base Qwen/Qwen3-Coder-Next,
; arch qwen3next - held the `coder` alias until 2026-08-03. Weights and drafter
; deleted from disk 2026-08-04 (see candidates.md "Measured on this box" for
; the full verdict history).
;
; 2026-08-04 GPU-hang incident, fix attempted and redeployed same day, then
; reverted a second time: Thinking-Distill hit two `amdgpu ring comp_1.1.0
; timeout` -> `ErrorDeviceLost` GPU hangs within its first 3 hours live under
; real opencode traffic (never reproduced by any standalone eval). Root cause:
; the first deployed config omitted `spec-draft-type-k/v` (defaults to F16),
; unlike Ornith's proven `q8_0`; the MTP draft context runs a full catch-up
; decode on every prefill ubatch (common/speculative.cpp process()), so its KV
; bandwidth scales with the whole accumulated conversation - F16 at n-max=4
; roughly doubles that bandwidth over Ornith's q8_0-at-n-max=3. Reverted to
; Ornith immediately, then attempted a fix by adding `spec-draft-type-k/v =
; q8_0` (kept n-max=4) and verified via a ~20 min standalone soak on a spare
; port crossing both incident depths (~2k and >67k accumulated tokens) with
; concurrent two-slot traffic - zero hangs, but that soak was shorter than the
; ~30 min mark where the first real incident hit, so it was redeployed on
; good-but-incomplete confidence rather than a proven-safe config. Reverted to
; Ornith a second time before that confidence was upgraded by real traffic;
; Thinking-Distill now lives only in the `nerkyor-eval` slot above for further
; isolation, out of the production path. Full incident + soak-test writeup in
; candidates.md.

; measured-optimal defaults: Radeon 780M / Zen4 / Mesa 26.1.6 / 60 GiB GTT
; retune ubatch-size after any Mesa or llama.cpp update
[*]
n-gpu-layers   = 99
flash-attn     = on
ubatch-size    = 2048
batch-size     = 2048
threads        = 8
cache-type-k   = q8_0
cache-type-v   = q8_0
jinja          = true
cache-reuse    = 256

; agent clients (Claude Code, OpenCode) interleave one large growing prompt
; with small background requests; a second slot keeps those from evicting the
; main prefix, unified KV keeps the full ctx available to either slot, and the
; RAM prompt-cache restores any prefix that still gets displaced
parallel       = 2
kv-unified     = true
cache-ram      = 16384

; FAST: general all-rounder - Ornith-1.0-35B (Qwen3.5-MoE, 8 of 256 active)
; Reasoning, vision and tools in one model. SWE-bench Verified 75.6 / Pro 50.4 /
; Multilingual 69.3, Terminal-Bench 64.2 - above coder's 70.6/44.3/62.8.
; draft length 3 is the peak: acceptance 0.83 and 34.6 t/s, against 0.29 and
; 20.2 t/s at the default 6. Measured 2/3/4/6; retune if the MTP head changes.
; p-min 0.3 truncates low-confidence drafts: +2% tg, acceptance 0.85-0.87
; (0.2 barely fires, 0.5 over-truncates - measured 2026-08-02). q8_0 draft KV
; measures 0% on speed and halves the MTP layer's KV footprint.
;
; Reclaimed the alias a second time 2026-08-04: the q8_0-fixed Thinking-Distill
; redeploy had only ~20 min of standalone soak behind it, short of the ~30 min
; mark where the first incident hit, so production traffic was moved back to
; the proven-stable config while evaluation continues out of band in the
; `nerkyor-eval` slot below - see the incident notes above and candidates.md.
;
; ctx-size raised 131072 -> 262144 2026-08-04: the GGUF's own
; qwen35moe.context_length is 262144 (`gguf_dump.py`, confirmed on the box),
; so 131072 was leaving native context on the table, not a safety margin.
; Verified loadable standalone on a spare port at 262144 with this exact spec
; config (n-max=3, p-min=0.3, q8_0 draft-KV) before applying here: ~30.5 GiB
; GTT+VRAM total, comfortably inside the 76 GiB pool with `models-max = 1`.
; Not yet exercised past 131072 in any eval script - retune/re-verify
; anything depth-sensitive (draft acceptance, p-min) if it's ever run there.
[fast]
model            = /root/models/ornith35-mtp-q.gguf
mmproj           = /root/models/ornith35-mmproj-F16.gguf
cache-ram        = 24576
spec-type        = draft-mtp
spec-draft-n-max = 3
spec-draft-p-min = 0.3
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
ctx-size         = 262144
reasoning-format = deepseek
load-on-startup  = true

; NERKYOR-EVAL: nerkyor/Qwen3.6-35B-A3B-DSV4Pro-Thinking-Distill, Q4_K_M
; (20.22 GiB) + mmproj-F16 (0.84 GiB). TEMPORARY - evaluation only, not
; load-on-startup, not wired to opencode.json or any client. Select it
; explicitly with `"model": "nerkyor-eval"` to run eval scripts against it
; without touching production `fast` traffic; `models-max = 1` swaps it in on
; demand and swaps back out on the next request against another alias.
;
; Carries the q8_0 draft-KV fix (spec-draft-type-k/v) from the second `fast`
; redeploy attempt - do not drop it, see the incident notes near the top of
; this file. Otherwise identical to that redeploy's config: beats Ornith on
; base and served throughput and wins decisively on reason-eval-hard.sh
; (10/10 zero-truncation vs Ornith's 8-9/10 with truncations) - see
; candidates.md. What is unresolved is production stability: two
; `ErrorDeviceLost` GPU hangs surfaced only under real opencode traffic, never
; under any standalone eval here, so treat wins on this slot as necessary but
; not sufficient before it can retake `fast`.
[nerkyor-eval]
model            = /root/models/nerkyor-thinking-distill-q4.gguf
mmproj           = /root/models/nerkyor-thinking-distill-mmproj-F16.gguf
cache-ram        = 24576
spec-type        = draft-mtp
spec-draft-n-max = 4
spec-draft-type-k = q8_0
spec-draft-type-v = q8_0
ctx-size         = 262144
reasoning-format = deepseek
load-on-startup  = false

; CODER: nerkyor/Qwen3.6-35B-A3B-DSV4Pro-SFT-GPT56Sol-RL-Agent-GGUF, Q4 tier
; (19.06 GiB). Community SFT+RL fine-tune of Qwen/Qwen3.6-35B-A3B, 256 experts
; top-8, 40 blocks, GDN hybrid. Took the alias from Qwen3-Coder-Next 2026-08-03.
;
; Why the swap: measured on this box it beats Coder-Next on every axis - pp 326
; vs 229, tg 26.4 vs 18.6 base, served 26.14 vs 25 (and Coder-Next's 25 needed
; DFlash; this has no speculation at all). code-eval 4/4 in 104 s against 2/4 in
; 162 s with a stall. Coder-Next had also stopped loading entirely - repeatable
; DeviceLost during load - so the alias was unusable as it stood.
;
; No speculation available: no MTP head, no DFlash drafter, and the model card
; says explicitly not to pass --model-draft. That costs ~32% generation against
; fast, which is why this is `coder` and not the default.
;
; The GGUF's general.architecture reads qwen3next, but the weights are the
; qwen35moe-family Qwen3.6-35B-A3B and both behaviour and throughput track
; qwen35moe, not Coder-Next's slower qwen3next path. Mislabelled tag on a
; correctly-working model - see candidates.md for how that was established.
;
; ctx-size raised 131072 -> 262144 2026-08-04, matching the GGUF's own
; qwen3next.context_length (confirmed via gguf_dump.py, same 262144 the
; qwen35moe-family aliases carry). This model has still only been exercised to
; 32768 in any eval script. Re-measure before trusting a long prefix.
[coder]
model            = /root/models/nerkyor-dsv4pro-q4.gguf
cache-ram        = 24576
ctx-size         = 262144
reasoning-format = deepseek
load-on-startup  = false

; ASSIST: Hermes Agent and general-purpose use; vision plus a 394 t/s prefill
; lead, which is the only reason it is still here (fast also has vision)
; 32 t/s and 262K native ctx; no thinking channel, so send reasoning work to
; fast/deep. Chosen over gemma-4-26B-A4B, which also passed vision and tools
; but generates at 17.8 t/s - its one advantage, a real reasoning channel, is
; already covered by fast (thinking, and faster) and deep (reasoning_effort,
; and stronger).
;
; ctx-size raised 131072 -> 262144 2026-08-04, matching the GGUF's own
; qwen3vlmoe.context_length (confirmed via gguf_dump.py). Verified loadable
; standalone at 262144 on a spare port before applying: ~33 GiB GTT+VRAM
; total, comfortably inside the pool alone.
[assist]
model            = /root/models/Qwen3-VL-30B-A3B-Instruct-UD-Q4_K_XL.gguf
mmproj           = /root/models/Qwen3-VL-30B-A3B-mmproj-F16.gguf
ctx-size         = 262144
load-on-startup  = false

; DEEP: architecture design, deep analysis. ctx-size is already gpt-oss-120b's
; own GGUF-declared ceiling (gpt-oss.context_length = 131072, YaRN-extended
; from a 4096 base per its own rope.scaling.* metadata) - there is no larger
; native context to raise this to.
; effort per request: chat_template_kwargs {"reasoning_effort": "low"|"medium"|"high"}
[deep]
model            = /root/models/gpt-oss-120b-MXFP4.gguf
ctx-size         = 131072
reasoning-format = deepseek
load-on-startup  = false
